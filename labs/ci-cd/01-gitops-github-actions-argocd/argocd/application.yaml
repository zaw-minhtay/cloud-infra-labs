# Tells Argo CD what to deploy: the deploy/ folder of your repo, into namespace demo.
# Step 14 replaces your-github-username with your GitHub username when applying this file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-github-username/cloud-infra-labs.git
    targetRevision: main
    path: labs/ci-cd/01-gitops-github-actions-argocd/deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true      # delete resources that were removed from Git
      selfHeal: true   # revert manual changes in the cluster
