spring.application.name=items-api
server.port=8080

# Shown at GET / ; CodeBuild sets APP_VERSION to the Git commit ID.
app.version=${APP_VERSION:dev}

# Aurora MySQL. ECS sets DB_HOST, DB_NAME, and DB_USER, and injects DB_PASSWORD from Secrets Manager.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:appdb}
spring.datasource.username=${DB_USER:appadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000

# Create the items table on start-up if it does not exist yet (src/main/resources/schema.sql).
spring.sql.init.mode=always
