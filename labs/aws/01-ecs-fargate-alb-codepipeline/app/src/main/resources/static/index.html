<!doctype html>
<!-- Web page for the Items API (Lab 01, aws). Spring Boot serves it at GET /.
     It uses the same REST API as the curl commands in the guide, from this one file:
     no libraries and nothing loaded from the internet. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Items</title>
  <style>
    :root {
      --text: #1f2328;
      --muted: #57606a;
      --border: #d0d7de;
      --header: #f6f8fa;
      --accent: #0969da;
      --error: #cf222e;
    }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: #ffffff; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px;
             padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { margin: 0; font-size: 1.5rem; }
    #version { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 0.9rem; }
    form { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 4px; }
    input { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font: inherit; box-sizing: border-box; }
    #new-name { flex: 1 1 160px; }
    #new-description { flex: 3 1 240px; }
    button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--header);
             font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
    #message { min-height: 1.4em; margin: 4px 0 12px; color: var(--error); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
    th { background: var(--header); color: var(--muted); font-size: 0.85rem; }
    td input { width: 100%; min-width: 120px; }
    .actions { text-align: right; white-space: nowrap; }
    .empty { padding: 24px; text-align: center; color: var(--muted); }
    .note { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Items</h1>
    <span id="version">loading…</span>
  </header>

  <form id="add-form">
    <input id="new-name" placeholder="Name" maxlength="100" required>
    <input id="new-description" placeholder="Description (optional)" maxlength="500">
    <button class="primary" type="submit">Add</button>
  </form>
  <p id="message" role="alert"></p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>ID</th><th>Name</th><th>Description</th><th>Updated</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <p class="note">The data is stored in Aurora MySQL. The same data as JSON: <a href="/items">/items</a>.</p>
</main>

<script>
  const rows = document.getElementById("rows");
  const message = document.getElementById("message");

  // Calls the REST API; throws with the API's own error text ({"error": "..."}) when it fails.
  async function api(method, path, body) {
    const response = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await response.json().catch(() => null);
    if (!response.ok) {
      throw new Error(data && data.error ? data.error : "request failed (HTTP " + response.status + ")");
    }
    return data;
  }

  function showError(error) {
    message.textContent = error.message;
  }

  // All text goes in with textContent, never as HTML, so item names can't inject markup.
  function textCell(text) {
    const td = document.createElement("td");
    td.textContent = text;
    return td;
  }

  function inputCell(value, maxLength) {
    const td = document.createElement("td");
    const input = document.createElement("input");
    input.value = value;
    input.maxLength = maxLength;
    td.append(input);
    return td;
  }

  function button(label, onClick, primary) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    if (primary) b.className = "primary";
    b.addEventListener("click", onClick);
    return b;
  }

  function formatTime(value) {
    const time = new Date(value);
    return isNaN(time) ? value : time.toLocaleString();
  }

  function itemRow(item) {
    const tr = document.createElement("tr");
    const actions = document.createElement("td");
    actions.className = "actions";
    actions.append(button("Edit", () => tr.replaceWith(editRow(item))));
    tr.append(textCell(item.id), textCell(item.name), textCell(item.description),
              textCell(formatTime(item.updatedAt)), actions);
    return tr;
  }

  function editRow(item) {
    const tr = document.createElement("tr");
    const name = inputCell(item.name, 100);
    const description = inputCell(item.description, 500);
    const actions = document.createElement("td");
    actions.className = "actions";
    actions.append(
      button("Save", async () => {
        try {
          await api("PUT", "/items/" + item.id, {
            name: name.firstChild.value,
            description: description.firstChild.value,
          });
          await loadItems();
        } catch (error) {
          showError(error);
        }
      }, true),
      " ",
      button("Cancel", () => tr.replaceWith(itemRow(item))),
    );
    tr.append(textCell(item.id), name, description, textCell(formatTime(item.updatedAt)), actions);
    return tr;
  }

  async function loadItems() {
    const items = await api("GET", "/items");
    if (items.length === 0) {
      const td = textCell("No items yet. Add one above.");
      td.colSpan = 5;
      td.className = "empty";
      const tr = document.createElement("tr");
      tr.append(td);
      rows.replaceChildren(tr);
    } else {
      rows.replaceChildren(...items.map(itemRow));
    }
    message.textContent = "";
  }

  document.getElementById("add-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const name = document.getElementById("new-name");
    const description = document.getElementById("new-description");
    try {
      await api("POST", "/items", { name: name.value, description: description.value });
      name.value = "";
      description.value = "";
      await loadItems();
      name.focus();
    } catch (error) {
      showError(error);
    }
  });

  // The header shows which build is running: after a deploy, reload to see the new commit ID.
  api("GET", "/info")
    .then((info) => { document.getElementById("version").textContent = info.app + " · " + info.version; })
    .catch(() => { document.getElementById("version").textContent = "version unavailable"; });

  loadItems().catch(showError);
</script>
</body>
</html>
